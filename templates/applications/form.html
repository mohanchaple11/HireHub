{% extends 'base.html' %}
{% block content %}
<section class="form-panel">
	<p class="eyebrow">Application</p>
	<h1>Apply for {{ job.title }}</h1>
	<form method="post" enctype="multipart/form-data">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit">Submit application</button>
	</form>
</section>
{% endblock %}
